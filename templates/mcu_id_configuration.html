<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>MCU ID Configuration · AproposDrive Firmware Uploader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <button id="sidebar-overlay" class="sidebar-overlay" type="button" aria-label="Close navigation"></button>
  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand"><span class="brand-mark" aria-hidden="true">↯</span><span>Service tool</span></div>
    <nav class="sidebar-nav"><a href="{{ url_for('index') }}">Firmware update</a><a href="{{ url_for('mcu_id_page') }}">Flash MCU ID</a></nav>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div class="topbar-start"><button id="sidebar-toggle" class="icon-button" type="button" title="Open navigation" aria-label="Open navigation" aria-expanded="false">☰</button><div class="brand"><span class="brand-mark" aria-hidden="true">↯</span><div><p>OFFLINE SERVICE TOOL <span class="software-version">v1.01.01</span></p><h1>MCU ID Configuration</h1></div></div></div>
      <div class="top-actions"><button id="theme-toggle" class="icon-button" title="Toggle colour mode" aria-label="Toggle colour mode">☼</button></div>
    </header>

    <section class="card configuration-card">
      <div class="section-heading"><span class="section-number">01</span><div><h2>MCU ID defaults</h2></div></div>
      <form id="mcu-id-configuration-form" class="mcu-id-form">
        <fieldset class="mcu-id-section">
          <legend>Part number</legend>
          <div class="mcu-id-fields">
            <label>Brand name <input name="brand_name" maxlength="3" minlength="3" required></label>
            <label>Phases <input name="phases" maxlength="1" minlength="1" required></label>
            <label>Switches in parallel <input name="switches_in_parallel" maxlength="1" minlength="1" required></label>
            <label>Switch type <input name="switch_type" maxlength="1" minlength="1" required></label>
            <label>PCB type <input name="pcb_type" maxlength="1" minlength="1" required></label>
          </div>
        </fieldset>

        <fieldset class="mcu-id-section">
          <legend>Application type</legend>
          <div class="mcu-id-fields">
            <label>Sensor <input name="sensor" maxlength="1" minlength="1" required></label>
            <label>NTC resistor <input name="ntc_resistor" maxlength="3" minlength="3" required></label>
            <label>NTC volt <input name="ntc_volt" maxlength="1" minlength="1" required></label>
            <label>NTC value B <input name="ntc_value_b" maxlength="2" minlength="2" required></label>
          </div>
        </fieldset>

        <fieldset class="mcu-id-section">
          <legend>Serial number</legend>
          <div class="mcu-id-fields">
            <label>EMS <input name="ems" maxlength="2" minlength="2" required></label>
            <label>Year / month <input name="year_month" maxlength="4" minlength="4" required></label>
            <label>Batch number <input name="batch_number" maxlength="4" minlength="4" required></label>
          </div>
        </fieldset>

        <div class="configuration-actions"><button class="button primary" type="submit">Save configuration</button><a class="button secondary" href="{{ url_for('mcu_id_page') }}">Open Flash MCU ID</a></div>
      </form>
    </section>
  </main>
  <script src="{{ url_for('static', filename='notifications.js') }}?v=20261119-toast"></script>
  <script src="{{ url_for('static', filename='navigation.js') }}?v=20261119-sidebar"></script>
  <script src="{{ url_for('static', filename='mcu-id-configuration.js') }}?v=20261123-configuration"></script>
</body>
</html>
